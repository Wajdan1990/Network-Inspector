name: Build Universal APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Setup Full Flutter Skeleton
      run: |
        mkdir -p temp_app
        cp lib/main.dart temp_app/ 2>/dev/null || true
        cp pubspec.yaml temp_app/ 2>/dev/null || true
        flutter create --org com.example network_inspector
        cp temp_app/main.dart network_inspector/lib/main.dart 2>/dev/null || true
        cp temp_app/pubspec.yaml network_inspector/pubspec.yaml 2>/dev/null || true

    - name: Install dependencies
      run: |
        cd network_inspector
        flutter pub get

    - name: Build APK Universal
      run: |
        cd network_inspector
        flutter build apk --debug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Network-Inspector-APK
        path: network_inspector/build/app/outputs/flutter-apk/app-debug.apk
