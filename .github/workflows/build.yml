name: Build Cudy-Style Inspector APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Setup Project Structure
      run: |
        mkdir -p backup_files
        cp lib/main.dart backup_files/ 2>/dev/null || true
        cp pubspec.yaml backup_files/ 2>/dev/null || true
        flutter create --org com.cudy.inspector app_cudy
        cp backup_files/main.dart app_cudy/lib/main.dart 2>/dev/null || true
        cp backup_files/pubspec.yaml app_cudy/pubspec.yaml 2>/dev/null || true

    - name: Fetch Dependencies
      run: |
        cd app_cudy
        flutter pub get

    - name: Build Optimized Release APK
      run: |
        cd app_cudy
        flutter build apk --release --target-platform android-arm64 --split-per-abi

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: NetworkInspector-CudyStyle
        path: app_cudy/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
